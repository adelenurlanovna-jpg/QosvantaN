name: Scrape processors

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      max_countries:
        description: "Max countries to process (default 70)"
        required: false
        default: "70"
      all:
        description: "Ignore freshness skip (true/false)"
        required: false
        default: "false"

concurrency:
  group: scrape-processors
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="--max-countries ${{ github.event.inputs.max_countries || '70' }}"
          if [ "${{ github.event.inputs.all }}" = "true" ]; then
            ARGS="$ARGS --all"
          fi
          uv run python scripts/scrape_processors.py $ARGS
